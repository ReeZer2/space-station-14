- type: entity
  id: Changeling
  parent: [BaseGameRule, BaseRoundstartAntagRule]
  components:
  - type: ChangelingRule
  - type: GameRule
    minPlayers: 20
    delay:
      min: 240
      max: 420
    cancelPresetOnTooFewPlayers: false
  - type: AntagSelection
    agentName: changeling-round-end-agent-name
    lateJoinAdditional: true
    selectionTime: PrePlayerSpawn
    antags:
    - !type:LinearAntagCount
      proto: Changeling
      playerRatio: 15
      range:
        min: 1
        max: 3
  - type: AntagRandomObjectives
    sets:
    - groups: ChangelingObjectiveGroupDevourDummy
      maxPicks: 1
    - groups: ChangelingObjectiveGroupEscapeDummy
      maxPicks: 1
    - groups: ChangelingObjectiveGroupKillDummy
      maxPicks: 1
    maxDifficulty: 8
  - type: DynamicRuleCost
    cost: 75

