# Bounds Guide
#1D2L3U4R

# This prototype is used as a parent by unique named pets (e.g Pun Pun, Ian, Hamlet)
- type: entity
  abstract: true
  id: BaseUniquePet
  components:
  - type: Grammar
    attributes:
      proper: true # Makes the pet's ingame name count as a proper noun (e.g, they have colored names when that accessibility setting is enabled)
  - type: NameIdentifier
    group: null # Strips the numeric identifier from the pet's ingame name

- type: entity
  parent: [ BaseUniquePet, MobCorgi, BaseSlicingRefinableButchering ]
  id: MobCorgiIan
  name: Ian
  description: Favorite pet corgi.
  components:
  #SS220 languages revive begin
  - type: Language
    availableLanguages:
  #SS220 Animalistic languages fix begin
    - id: Doggish
      canSpeak: true
    - id: Feline
      canSpeak: false
    - id: Mousey
      canSpeak: false
    - id: Monkey
      canSpeak: false
    - id: Reptilian
      canSpeak: false
    - id: Piggish
      canSpeak: false
  #SS220 Animalistic languages fix end
    - id: Galactic
      canSpeak: false
  #SS220 languages revive end
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Pets/corgi.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: ian
  - type: Inventory
    speciesId: dog
    templateId: Corgi
    displacements:
      head:
        sizeMaps:
          32:
            sprite: Mobs/Pets/displacements.rsi
            state: corgi_head_displacement
      eyes:
        sizeMaps:
          32:
            sprite: Mobs/Pets/displacements.rsi
            state: corgi_eyes_displacement
      mask:
        sizeMaps:
          32:
            sprite: Mobs/Pets/displacements.rsi
            state: corgi_mask_displacement
  - type: DamageStateVisuals
    states:
      Alive:
        Base: ian
      Critical:
        Base: ian_dead
      Dead:
        Base: ian_dead
  - type: Grammar
    attributes:
      proper: true
      gender: male
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatCorgi
      amount: 2
    - id: MaterialHideCorgi
  - type: Tag
    tags:
    - CannotSuicide
    - VimPilot
    - Ian
  - type: StealTarget
    stealGroup:
    - AnimalIan

