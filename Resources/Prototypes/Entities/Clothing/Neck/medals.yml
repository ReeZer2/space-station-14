    materialComposition:
      Cloth: 100
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 15
  - type: Tag
    tags:
    - Medal
    - MonkeyWearable
    - ClothMade
    - Recyclable
    - WhitelistChameleon

