- type: entity
  parent: BaseItem
  id: RadioHandheld
  name: handheld radio
  description: A handy handheld radio.
  components:
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Handheld
  - type: RadioSpeaker
    channels:
    - Handheld
  - type: Speech
    speechVerb: Robotic
  - type: Sprite
    sprite: SS220/Objects/Devices/radio_handheld.rsi #SS220 radio resprite 
    layers:
    - state: walkietalkie
    - map: [enum.RadioDeviceVisualLayers.Broadcasting]
      state: walkietalkie-on
      shader: unshaded
      visible: false
    - map: [enum.RadioDeviceVisualLayers.Speaker]
      state: walkietalkie-active
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RadioDeviceVisuals.Broadcasting:
        enum.RadioDeviceVisualLayers.Broadcasting:
          True: { visible: true }
          False: { visible: false }
      enum.RadioDeviceVisuals.Speaker:
        enum.RadioDeviceVisualLayers.Speaker:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    sprite: SS220/Objects/Devices/radio_handheld.rsi #SS220 radio resprite 
    heldPrefix: walkietalkie
  - type: Tag
    tags:
    - Radio

- type: entity
  parent: [ RadioHandheld, BaseSecurityContraband ]
  id: RadioHandheldSecurity
  name: security radio
  description: A handy security radio.
  components:
  - type: RadioMicrophone
    broadcastChannel: Security
    listenRange: 1
  - type: RadioSpeaker
    channels:
    - Security
  - type: Sprite
#SS220 radio resprite START
    sprite: SS220/Objects/Devices/radio_handheld.rsi
    layers:
    - state: walkietalkie-sec
    - state: walkietalkie-on
#SS220 radio resprite END
  - type: Item
