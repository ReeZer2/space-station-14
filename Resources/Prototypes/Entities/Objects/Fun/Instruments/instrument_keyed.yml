- type: entity
  parent: BaseHandheldInstrument
  id: BaseKeyedInstrument
  abstract: true
  components:
  - type: Tag
    tags:
    - KeyedInstrument

- type: entity
  parent: BaseKeyedInstrument
  id: SynthesizerInstrument
  name: synthesizer
  components:
  - type: Instrument
    program: 62
  - type: SwappableInstrument
    instrumentList:
      swappable-instrument-style-electro: {62: 0} #i needed generic sounding synth presets, sue me
      swappable-instrument-style-bubbles: {63: 0}
      swappable-instrument-style-square: {80: 0}
  - type: Sprite
    sprite: SS220/Objects/Fun/Instruments/h_synthesizer.rsi # SS220 Synthesizer resprite
    state: icon
  - type: Item
    size: Normal
    sprite: SS220/Objects/Fun/Instruments/h_synthesizer.rsi # SS220 Synthesizer resprite
  - type: StaticPrice
    price: 90

- type: entity
  parent: BaseKeyedInstrument
  id: SuperSynthesizerInstrument
  suffix: For playtime #SS220-add-time-loadout-suffix
  name: super synthesizer
  description: Blasting the ghetto with Touhou MIDIs since 2020.
  components:
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
  - type: Sprite
    sprite: SS220/Objects/Fun/Instruments/h_synthesizer.rsi # SS220 Synthesizer resprite
    state: supersynth
  - type: Item
    heldPrefix: super
    sprite: SS220/Objects/Fun/Instruments/h_synthesizer.rsi # SS220 Synthesizer resprite

- type: entity
  parent: SuperSynthesizerInstrument
  id: SuperSynthesizerNoLimitInstrument
  suffix: NoLimits Admin
  components:
  - type: Instrument
    respectMidiLimits: false

- type: entity
  parent: BaseKeyedInstrument
  id: AccordionInstrument
  name: accordion
  components:
  - type: Instrument
    program: 21
  - type: SwappableInstrument
    instrumentList:
      swappable-instrument-style-standard: {21: 0}
      swappable-instrument-style-tango: {23: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/accordion.rsi

- type: entity
  parent: BaseKeyedInstrument
  id: KalimbaInstrument
  name: kalimba
  description: The power of a piano right at your thumbs.
  components:
  - type: Instrument
    program: 108
  - type: Sprite
    sprite: Objects/Fun/Instruments/kalimba.rsi
  - type: Item
    size: Small
